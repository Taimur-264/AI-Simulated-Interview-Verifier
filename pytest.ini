# Pytest configuration - run from the project folder (ai-interview-verifier/):
#
#     python -m pytest            (uses backend/venv if that python is active)
#
# The suite is an integration suite: it needs the backend running on
# 127.0.0.1:8000 (uvicorn) and a reachable PostgreSQL, and it skips with a
# clear reason if the server is down. Every account/posting/interview it
# creates is removed again, even when a test fails.
[pytest]
testpaths = backend/tests
pythonpath = backend
norecursedirs = .* backend/venv frontend venv node_modules build dist *.egg
addopts = -ra
